# DRIFT DETECTION — nightly plan; exit code 2 from -detailed-exitcode means
# "changes present", i.e. someone/something changed infra outside Terraform.
# Opens a GitHub issue with the diff instead of paging anyone at 3am. 🕵️
# Copy to: .github/workflows/drift.yml

name: terragrunt-drift-detection

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily
  workflow_dispatch: {} # allow manual "check now" runs

env:
  TF_VERSION: "1.9.8"
  TG_VERSION: "0.67.0"

jobs:
  drift:
    name: drift-${{ matrix.env }}
    runs-on: ubuntu-latest
    environment: ${{ matrix.env }}
    strategy:
      fail-fast: false
      matrix:
        env: [dev, prod]

    defaults:
      run:
        working-directory: terragrunt-tutorial/13-capstone-project/live/${{ matrix.env }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform ${{ env.TF_VERSION }}
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Install Terragrunt ${{ env.TG_VERSION }}
        run: |
          curl -sSL -o terragrunt \
            "https://github.com/gruntwork-io/terragrunt/releases/download/v${TG_VERSION}/terragrunt_linux_amd64"
          chmod +x terragrunt
          sudo mv terragrunt /usr/local/bin/terragrunt

      - name: Configure AWS credentials (OIDC 🔐)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Plan with detailed exit code (0=clean, 2=drift, 1=error)
        id: drift
        run: |
          set +e
          terragrunt run-all plan -detailed-exitcode \
            --terragrunt-non-interactive --terragrunt-parallelism 4 > drift.log 2>&1
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          tail -c 50000 drift.log > drift-tail.log || true
          # Exit 1 = real error → fail loudly. Exit 2 = drift → handled next step.
          test "$code" -ne 1 || (echo "❌ plan errored" && exit 1)
          exit 0

      - name: Open issue if drift detected
        if: steps.drift.outputs.code == '2'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync(
              `terragrunt-tutorial/13-capstone-project/live/${{ matrix.env }}/drift-tail.log`, 'utf8');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Infra drift detected in ${{ matrix.env }} (${new Date().toISOString().slice(0, 10)})`,
              body: [
                'Nightly `run-all plan` found changes nobody applied — likely manual (ClickOps) edits.',
                '',
                '<details><summary>Drifted plan output</summary>',
                '',
                '```terraform',
                log.slice(-50000),
                '```',
                '</details>'
              ].join('\n'),
              labels: ['drift', '${{ matrix.env }}']
            });
